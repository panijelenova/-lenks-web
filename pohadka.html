<script>
  // Načte pohádku podle id v adrese (?id=cenda) z data/pohadky.json a vykreslí detail.
  (function () {
    function escapovat(text) {
      var d = document.createElement('div');
      d.textContent = text == null ? '' : text;
      return d.innerHTML;
    }

    var parametry = new URLSearchParams(window.location.search);
    var id = parametry.get('id');
    var obsah = document.getElementById('obsah-pohadky');

    if (!id) {
      obsah.innerHTML = '<p>Tuhle pohádku se nepodařilo najít. <a href="hudebni-pohadky.html">Zpět na přehled pohádek</a>.</p>';
    } else {
      fetch('data/pohadky.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var pohadka = (data.pohadky || []).find(function (p) { return p.id === id; });

          if (!pohadka) {
            obsah.innerHTML = '<p>Tuhle pohádku se nepodařilo najít. <a href="hudebni-pohadky.html">Zpět na přehled pohádek</a>.</p>';
            return;
          }

          document.title = pohadka.nazev + ' – LENKS';
          document.getElementById('popis-stranky').setAttribute('content', 'Hudební pohádka Lenky Seidlové: ' + pohadka.nazev + '.');
          document.getElementById('drobecek-nazev').textContent = pohadka.nazev;

          var ucinkujiciHtml = (pohadka.ucinkujici || []).map(function (u) {
            return '<li>' + escapovat(u.jmeno) + (u.role ? ': ' + escapovat(u.role) : '') + '</li>';
          }).join('');

          var delkaHtml = pohadka.delka_vek
            ? '<p class="pohadka-info-extra">' + escapovat(pohadka.delka_vek) + '</p>'
            : '';

          var plakatHtml = pohadka.plakat
            ? '<div class="pohadka-detail-plakat"><img src="' + escapovat(pohadka.plakat) + '" alt="' + escapovat(pohadka.nazev) + '"></div>'
            : '';

          obsah.innerHTML =
            '<div class="pohadka-detail">' +
              plakatHtml +
              '<div class="pohadka-detail-obsah">' +
                '<h1>' + escapovat(pohadka.nazev) + '</h1>' +
                '<p>' + escapovat(pohadka.popis) + '</p>' +
                (ucinkujiciHtml ? '<div class="pohadka-ucinkujici"><h2>Účinkující</h2><ul>' + ucinkujiciHtml + '</ul></div>' : '') +
                delkaHtml +
                '<a href="kontakt.html" class="tlacitko-zajem">Mám zájem o tuto pohádku</a>' +
              '</div>' +
            '</div>';
        })
        .catch(function () {
          obsah.innerHTML = '<p>Pohádku se nepodařilo načíst. Zkuste to prosím později.</p>';
        });
    }
  })();
</script>

</body>
